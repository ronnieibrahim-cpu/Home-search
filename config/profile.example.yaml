# Your household's numbers. Copy to config/profile.yaml (gitignored) and fill in,
# or drop in the planning export (home_search_budget.yaml) unchanged: this is the
# same shape, and keys the app does not know are ignored.
# For GitHub Actions, paste the finished file into a repository secret named
# PROFILE_YAML. THIS REPO IS PUBLIC: never commit the real file.

meta:
  generated: null                  # YYYY-MM-DD the balances below were read
  target_close_date: null          # YYYY-MM-DD; default June 1 of the purchase year

search:                            # optional; overrides config/search.yaml when set
  price_min: null
  price_max: null
  planning_price: null
  bedrooms_min: null
  bathrooms_min: null

income:
  gross_monthly_for_lender: 0      # income a lender will count
  net_take_home_monthly_post_home: 0

cash_for_purchase:
  balance: 0
  monthly_addition: 0              # saved each month until closing
  keep_after_closing: 0            # emergency buffer the app never spends

other_assets: {}                   # name: balance. Counted as lender reserves only.

financing:
  down_payment_pct: 0.20
  closing_costs_pct: null
  rate_assumption: null
  rate_range: []                   # [low, high] bracket shown in the digest
  physician_loan_programs: null    # "consider" to price that scenario

carrying_costs:
  property_tax_rate_modeled: null
  insurance_plus_maintenance_annual: null
  total_housing_carry_target_monthly: []   # [comfortable, flag-above]
  hoa_monthly: null

monthly_budget_after_purchase:
  non_housing_living_costs: 0
  savings_and_investing: 0
  hard_ceiling_total_housing: null

household:                         # optional extras, not in the planning export
  children_ages: []
  marginal_federal_rate: null      # needed for the mortgage-interest tax effect
  monthly_non_housing_debt: 0
  current_rent_monthly: null
  flood_tolerance: x_only          # x_only | allow_500yr | allow_100yr
  commute_anchors: []              # [{name: "Work", address: "..."}]
  max_commute_minutes: 30
